version: 2
updates:
  # Python deps: root requirements.txt (Docker image) and server/ (tox / setup.py)
  - package-ecosystem: pip
    directories:
      - "/"
      - "/server"
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # API image base (Dockerfile)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  # nginx and vouch-proxy images in docker-compose.yaml
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  # actions used by .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
